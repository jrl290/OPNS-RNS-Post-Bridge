# actions_rnsd.conf — OPNSense service actions for rnsd
#
# This makes rnsd appear in the OPNSense service management dashboard
# (System → Diagnostics → Services) with start/stop/restart/status.
#
# Format matches OPNSense's configd actions system.

[start]
command:/usr/local/etc/rc.d/rnsd start
type:script
message:Starting Reticulum Network Stack Daemon
description:Start rnsd

[stop]
command:/usr/local/etc/rc.d/rnsd stop
type:script
message:Stopping Reticulum Network Stack Daemon
description:Stop rnsd

[restart]
command:/usr/local/etc/rc.d/rnsd restart
type:script
message:Restarting Reticulum Network Stack Daemon
description:Restart rnsd

[status]
command:/usr/local/etc/rc.d/rnsd status
type:script
message:Checking rnsd status
description:Check rnsd status

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Rnsd/reconfigure.php
type:script
message:Regenerating Reticulum config and restarting
description:Reconfigure rnsd

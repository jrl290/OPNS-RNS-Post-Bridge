{# rnsd.conf — OPNSense config template for Reticulum bridge
 #
 # This template generates /usr/local/etc/reticulum/config
 # from the OPNSense config.xml values.
 #
 # Variables from General.php model:
 #   {{ general.enabled }}
 #   {{ general.PostInterfaceNodeUrl }}
 #   {{ general.PostInterfaceWakeUrl }}
 #   {{ general.PostInterfacePollInterval }}
 #   {{ general.BackboneBindAddress }}
 #   {{ general.BackboneBindPort }}
 #   {{ general.LogLevel }}
 #   {{ general.MTU }}
 #   {{ general.PathfinderMaxHops }}
 #   {{ general.EnableTransport }}
 #
 # The generated config is read by rnsd (Rust).
 # PostInterface type was ported from PHP — see
 # reticulum_rust/src/interfaces/post_interface.rs
 -#}

{% if general.enabled == '1' %}
# Reticulum Configuration — Auto-generated by OPNS-RNS-Post-Bridge
# DO NOT EDIT THIS FILE DIRECTLY — use Services → Reticulum Bridge in the web UI.
# Generated: {{ "now"|date("Y-m-d H:i:s T") }}

enable_transport = {% if general.EnableTransport == '1' %}Yes{% else %}No{% endif %}

[logging]
loglevel = {{ general.LogLevel|default(3) }}

[interfaces]

[[PostInterface Bridge]]
type = PostInterface
enabled = yes
name = "PostInterface Bridge"
node_url = "{{ general.PostInterfaceNodeUrl }}"
{% if general.PostInterfaceWakeUrl %}wake_url = "{{ general.PostInterfaceWakeUrl }}"{% endif %}
{% if general.PostInterfacePollInterval %}poll_interval_seconds = {{ general.PostInterfacePollInterval|default(5.0) }}{% endif %}
bitrate = 1000000000
mtu = {{ general.MTU|default(500) }}

[[Backbone Bridge]]
type = BackboneInterface
enabled = yes
name = "Backbone Bridge"
listen_ip = "{{ general.BackboneBindAddress|default('0.0.0.0') }}"
listen_port = {{ general.BackboneBindPort|default(4242) }}
bitrate = 1000000000

[transport]
rns_mtu = {{ general.MTU|default(500) }}
pathfinder_max_hops = {{ general.PathfinderMaxHops|default(128) }}
path_expiry_default_seconds = 604800
path_expiry_access_point_seconds = 86400
path_expiry_roaming_seconds = 21600
max_random_blobs = 64

{% else %}
# Reticulum Bridge is DISABLED
# Enable via: Services → Reticulum Bridge
{% endif %}
